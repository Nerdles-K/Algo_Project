spring:
  application:
    name: synchplay
  profiles:
    # Default to dev for local runs; override with SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/synchplay}
    username: ${DB_USER:synchplay}
    password: ${DB_PASSWORD:synchplay_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

synchplay:
  data:
    nodes-csv: ${NODES_CSV:../ProcessedData/mini_nodes.csv}
    edges-csv: ${EDGES_CSV:../ProcessedData/mini_edges.csv}
  jwt:
    expiry-seconds: ${JWT_EXPIRY:86400}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

---
# ───────────────────────── dev profile ─────────────────────────
# Verbose logging, SQL echo, and a baked-in JWT secret for zero-config
# local startup. NEVER use these defaults in a deployed environment.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    com.synchplay: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

synchplay:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_NOT_FOR_PROD_min32bytes_long_secret_key_xx}

---
# ───────────────────────── prod profile ────────────────────────
# Quiet logging and NO insecure defaults: JWT_SECRET and FRONTEND_ORIGIN
# must be supplied via environment, otherwise the app fails fast on boot.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.synchplay: INFO
    org.hibernate.SQL: WARN

synchplay:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
